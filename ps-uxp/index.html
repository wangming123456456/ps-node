<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>PS 节点</title>
        <style>
            :root {
                color-scheme: dark;
                --text: #e8e8e8;
                --muted: rgba(255, 255, 255, 0.55);
                --placeholder: rgba(255, 255, 255, 0.3);
                --stroke: rgba(255, 255, 255, 0.12);
                --hover: rgba(255, 255, 255, 0.08);
                --active: rgba(255, 255, 255, 0.14);
                --panel: #1c1c1c;
                --field: rgba(255, 255, 255, 0.06);
            }

            @media (prefers-color-scheme: light) {
                :root {
                    color-scheme: light;
                    --text: #1a1a1a;
                    --muted: rgba(0, 0, 0, 0.5);
                    --placeholder: rgba(0, 0, 0, 0.32);
                    --stroke: rgba(0, 0, 0, 0.12);
                    --hover: rgba(0, 0, 0, 0.05);
                    --active: rgba(0, 0, 0, 0.08);
                    --panel: #f6f6f6;
                    --field: rgba(0, 0, 0, 0.05);
                }
            }

            html,
            body {
                margin: 0;
                height: 100%;
                background: transparent;
                color: var(--text);
                font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
                font-size: 12px;
                line-height: 1.4;
                overflow: hidden;
            }

            [hidden] {
                display: none !important;
            }

            .app {
                display: flex;
                flex-direction: column;
                gap: 6px;
                height: 100vh;
                box-sizing: border-box;
                padding: 8px;
                overflow-y: auto;
                overflow-x: hidden;
            }

            /* 面板高度不够时整页滚动，不让内容互相挤压 */
            .bar,
            .docline,
            .row,
            .collapse {
                flex: none;
            }

            .app::-webkit-scrollbar {
                width: 6px;
            }

            .app::-webkit-scrollbar-thumb {
                background: var(--stroke);
                border-radius: 3px;
            }

            .app::-webkit-scrollbar-track {
                background: transparent;
            }

            .row {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }

            .row--between {
                justify-content: space-between;
            }

            .spacer {
                flex: 1;
            }

            .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--muted);
                flex: none;
            }

            .dot.ok {
                background: #22c55e;
            }

            .dot.error {
                background: #ef4444;
            }

            .muted {
                color: var(--muted);
                font-size: 11px;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .textbtn {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 11px;
                padding: 3px 6px;
                border-radius: 6px;
                cursor: pointer;
                white-space: nowrap;
                flex: none;
            }

            .textbtn:hover:not(:disabled) {
                background: var(--hover);
                color: var(--text);
            }

            .textbtn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .btn {
                appearance: none;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 4px;
                height: 28px;
                padding: 0 10px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 11px;
                cursor: pointer;
                white-space: nowrap;
                flex: none;
            }

            .btn:hover:not(:disabled) {
                background: var(--hover);
            }

            .btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .btn--primary {
                border-color: transparent;
                background: var(--text);
                color: var(--panel);
                font-weight: 600;
            }

            .btn--primary:hover:not(:disabled) {
                opacity: 0.86;
                background: var(--text);
            }

            .btn--grow {
                flex: 1;
            }

            .bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 6px;
                min-height: 20px;
            }

            .bar__status {
                display: flex;
                align-items: center;
                gap: 5px;
                min-width: 0;
            }

            .bar__text {
                font-size: 11px;
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .docline {
                display: flex;
                align-items: center;
                gap: 5px;
                min-width: 0;
                color: var(--muted);
                font-size: 11px;
            }

            .docline__name {
                color: var(--text);
                font-size: 11px;
                font-weight: 600;
                max-width: 46%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .docline__meta,
            .docline__state {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .docline__state {
                margin-left: auto;
            }

            .switch {
                position: relative;
                width: 30px;
                height: 16px;
                flex: none;
                padding: 0;
                border: 1px solid var(--stroke);
                border-radius: 999px;
                background: var(--active);
                cursor: pointer;
                appearance: none;
            }

            .switch[aria-pressed="true"] {
                background: var(--text);
                border-color: transparent;
            }

            .switch__thumb {
                position: absolute;
                top: 2px;
                left: 2px;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--panel);
                transition: transform 0.15s ease;
            }

            .switch[aria-pressed="true"] .switch__thumb {
                transform: translateX(14px);
                background: var(--panel);
            }

            .switch__label {
                font-size: 11px;
                color: var(--muted);
                flex: none;
            }

            .preview--clickable {
                cursor: pointer;
            }
            .preview {
                position: relative;
                flex: 1 1 160px;
                min-height: 140px;
                border-radius: 10px;
                border: 1px solid var(--stroke);
                background: var(--panel);
                overflow: hidden;
            }

            .preview__img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
            }

            .preview__img--result {
                background: var(--panel);
            }

            .preview__empty {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--placeholder);
                font-size: 11px;
            }

            .preview__overlay {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 8px;
                background: linear-gradient(to top, color-mix(in srgb, var(--panel) 92%, transparent), transparent);
            }

            .preview__label {
                font-size: 11px;
                color: var(--muted);
            }

            .section__title {
                font-size: 11px;
                font-weight: 600;
                color: var(--text);
            }

            .check {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                color: var(--muted);
                font-size: 11px;
                cursor: pointer;
                flex: none;
            }

            .input {
                width: 100%;
                min-width: 0;
                height: 28px;
                box-sizing: border-box;
                padding: 0 8px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 11px;
            }

            .input:focus {
                outline: none;
                border-color: var(--muted);
            }

            .input option {
                background: var(--panel);
                color: var(--text);
            }

            .textarea {
                width: 100%;
                box-sizing: border-box;
                height: 52px;
                min-height: 40px;
                resize: none;
                padding: 6px 8px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 11px;
                line-height: 1.5;
            }

            .textarea:focus {
                outline: none;
                border-color: var(--muted);
            }

            .gen__state {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .gen__state.error {
                color: #ef4444;
            }

            .collapse {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .collapse__head {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 11px;
                padding: 3px 0;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 2px;
                text-align: left;
            }

            .collapse__head:hover {
                color: var(--text);
            }

            .collapse__chevron {
                display: inline-block;
                width: 10px;
                transition: transform 0.15s ease;
            }

            .collapse.open .collapse__chevron {
                transform: rotate(90deg);
            }

            .collapse.open .collapse__head {
                color: var(--text);
            }

            .collapse__body {
                display: none;
                flex-direction: column;
                gap: 6px;
                padding: 2px 0;
            }

            .collapse.open .collapse__body {
                display: flex;
            }

            #log {
                margin: 0;
                padding: 6px;
                min-height: 56px;
                max-height: 140px;
                overflow: auto;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: var(--panel);
                color: var(--muted);
                font-size: 10px;
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .settings__head {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 2px 0;
            }

            .settings__group {
                display: flex;
                flex-direction: column;
                gap: 6px;
                padding: 8px;
                border: 1px solid var(--stroke);
                border-radius: 10px;
                background: var(--field);
                flex: none;
            }

            /* 设置区子项固定高度，不随面板高度压缩（不要影响绘图区的输入框布局） */
            .settings__group > * {
                flex: none;
            }

            .settings__group .field,
            .settings__group .check,
            .settings__group .seg,
            .settings__group .input {
                flex: none;
            }

            .settings__title {
                font-size: 11px;
                font-weight: 600;
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .field__label {
                font-size: 11px;
                color: var(--muted);
            }

            .seg {
                display: inline-flex;
                gap: 2px;
            }

            .seg button {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 11px;
                padding: 4px 9px;
                border-radius: 6px;
                cursor: pointer;
                font-variant-numeric: tabular-nums;
            }

            .seg button:hover {
                background: var(--hover);
                color: var(--text);
            }

            .seg button[aria-pressed="true"] {
                background: var(--active);
                color: var(--text);
                font-weight: 600;
            }

            #settings-log {
                margin: 0;
                padding: 6px;
                min-height: 48px;
                max-height: 120px;
                overflow: auto;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: var(--panel);
                color: var(--muted);
                font-size: 10px;
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
            }        </style>
    </head>
    <body>
        <div class="app" id="view-main">
            <div class="bar">
                <div class="bar__status">
                    <span id="dot" class="dot"></span>
                    <span id="status" class="bar__text">未连接</span>
                </div>
                <div class="row">
                    <button id="open-settings" type="button" class="textbtn" title="设置">⚙ 设置</button>
                    <button id="connect" type="button" class="textbtn">连接</button>
                </div>
            </div>

            <div class="docline">
                <span id="doc-name" class="docline__name">没有打开的文档</span>
                <span id="doc-meta" class="muted"></span>
                <span id="doc-state" class="docline__state muted"></span>
                <button id="refresh" type="button" class="textbtn">刷新</button>
            </div>

            <div class="preview" id="preview-box">
                <img id="shot-image" class="preview__img" alt="" hidden />
                <img id="preview" class="preview__img preview__img--result" alt="" hidden />
                <span id="preview-empty" class="preview__empty">没有打开的文档</span>
                <div id="result-overlay" class="preview__overlay" hidden>
                    <span class="preview__label">生成结果</span>
                    <span class="spacer"></span>
                    <button id="gen-apply" type="button" class="btn btn--primary" disabled>添加到图层</button>
                    <button id="result-close" type="button" class="btn">返回画面</button>
                </div>
            </div>


            <div class="row row--between">
                <div class="row">
                    <span class="section__title">AI 生成</span>
                    <button id="preview-ref-switch" type="button" class="switch" role="switch" aria-pressed="true" title="预览：参考画面 / 生成结果">
                        <span class="switch__thumb"></span>
                    </button>
                    <span class="switch__label" id="preview-ref-label">参考</span>
                </div>
                <div class="check"><input id="ref-toggle" type="checkbox" checked /><span>参考当前画面</span></div>
            </div>

            <div class="row">
                <select id="model-select" class="input">
                    <option value="">默认模型</option>
                </select>
                <button id="render" type="button" class="btn btn--primary">渲染 ▶</button>
            </div>

            <textarea id="prompt" class="textarea" placeholder="描述你想要的画面…"></textarea>

            <span id="gen-state" class="muted gen__state">就绪</span>

            <div class="muted" style="font-size: 10px">设置：点右上角 ⚙ 设置</div>
        </div>
        <script src="main.js"></script>
        <div class="app" id="view-settings" hidden>
            <div class="settings__head">
                <button id="close-settings" type="button" class="textbtn">‹ 返回</button>
                <span class="section__title">PS 节点设置</span>
                <span class="spacer"></span>
                <span class="dot" id="settings-dot"></span>
                <span class="muted" id="settings-status">未连接</span>
            </div>

            <div class="settings__group">
                <div class="settings__title">连接</div>
                <input id="setting-url" class="input" type="text" placeholder="http://localhost:23310" />
                <input id="setting-token" class="input" type="text" placeholder="token（中继要求时填写，可留空）" />
                <div class="row">
                    <button id="setting-test" type="button" class="textbtn">测试连接</button>
                    <span class="spacer"></span>
                    <button id="setting-apply" type="button" class="btn">应用并重连</button>
                </div>
            </div>

            <div class="settings__group">
                <div class="settings__title">生成</div>
                <div class="field">
                    <span class="field__label">默认模型</span>
                    <select id="setting-model" class="input">
                        <option value="">默认模型</option>
                    </select>
                </div>
                <div class="check"><input id="setting-ref" type="checkbox" checked /><span>默认参考当前画面</span></div>
                <div class="check"><input id="setting-auto-apply" type="checkbox" /><span>渲染后自动添加到图层</span></div>
            </div>

            <div class="settings__group">
                <div class="settings__title">预览</div>
                <div class="field">
                    <span class="field__label">预览最长边</span>
                    <div class="seg" id="setting-preview-size">
                        <button type="button" data-value="512">512</button>
                        <button type="button" data-value="1024">1024</button>
                        <button type="button" data-value="2048">2048</button>
                    </div>
                </div>
                <div class="check"><input id="setting-auto-refresh" type="checkbox" checked /><span>自动刷新预览</span></div>
            </div>

            <div class="settings__group">
                <div class="settings__title">日志</div>
                <pre id="settings-log"></pre>
                <div class="row">
                    <span class="spacer"></span>
                    <button id="setting-log-clear" type="button" class="textbtn">清空日志</button>
                </div>
            </div>

            <div class="settings__group">
                <div class="settings__title">关于</div>
                <div class="muted" id="settings-about">PS 节点 v0.1.18</div>
            </div>
        </div>    </body>
</html>
