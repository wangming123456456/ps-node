<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>PS 节点</title>
        <style>
            :root {
                color-scheme: dark;
                --text: #e0e0e0;
                --muted: rgba(255, 255, 255, 0.58);
                --placeholder: rgba(255, 255, 255, 0.35);
                --stroke: rgba(255, 255, 255, 0.12);
                --hover: rgba(255, 255, 255, 0.06);
                --active: rgba(255, 255, 255, 0.14);
                --panel: #1f1f1f;
            }

            @media (prefers-color-scheme: light) {
                :root {
                    color-scheme: light;
                    --text: #1a1a1a;
                    --muted: rgba(0, 0, 0, 0.5);
                    --placeholder: rgba(0, 0, 0, 0.32);
                    --stroke: rgba(0, 0, 0, 0.12);
                    --hover: rgba(0, 0, 0, 0.05);
                    --active: rgba(0, 0, 0, 0.08);
                    --panel: #ffffff;
                }
            }

            html,
            body {
                margin: 0;
                height: 100%;
                background: transparent;
                color: var(--text);
                font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
                font-size: 12px;
                line-height: 1.5;
            }

            body {
                overflow-y: auto;
            }

            [hidden] {
                display: none !important;
            }

            .app {
                display: flex;
                flex-direction: column;
                gap: 10px;
                padding: 10px;
                box-sizing: border-box;
            }

            .row {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
            }

            .row--between {
                justify-content: space-between;
            }

            .spacer {
                flex: 1;
            }

            .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--muted);
                flex: none;
            }

            .dot.ok {
                background: #22c55e;
            }

            .dot.error {
                background: #ef4444;
            }

            .muted {
                color: var(--muted);
                font-size: 11px;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .textbtn {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 11px;
                padding: 3px 7px;
                border-radius: 6px;
                cursor: pointer;
                white-space: nowrap;
                flex: none;
            }

            .textbtn:hover:not(:disabled) {
                background: var(--hover);
                color: var(--text);
            }

            .textbtn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .btn {
                appearance: none;
                border: 1px solid var(--stroke);
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 12px;
                height: 30px;
                padding: 0 12px;
                border-radius: 8px;
                cursor: pointer;
                white-space: nowrap;
            }

            .btn:hover:not(:disabled) {
                background: var(--hover);
            }

            .btn--primary {
                background: var(--active);
                border-color: transparent;
                font-weight: 600;
            }

            .btn--primary:hover:not(:disabled) {
                background: var(--active);
                opacity: 0.85;
            }

            .btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            /* ---------- 顶部：状态 + 标签页 ---------- */

            .bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                min-height: 22px;
            }

            .bar__status {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }

            .bar__text {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 11px;
                color: var(--muted);
            }

            .tabs {
                display: flex;
                align-items: stretch;
                gap: 4px;
                border-bottom: 1px solid var(--stroke);
            }

            .tab {
                appearance: none;
                border: 0;
                border-bottom: 2px solid transparent;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 12px;
                padding: 5px 9px 6px;
                margin-bottom: -1px;
                cursor: pointer;
            }

            .tab:hover {
                color: var(--text);
            }

            .tab--active {
                color: var(--text);
                font-weight: 600;
                border-bottom-color: var(--text);
            }

            .pane {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .pane[hidden] {
                display: none;
            }

            .section__title {
                font-size: 12px;
                font-weight: 600;
            }

            /* ---------- 文档 ---------- */

            .doc {
                display: flex;
                flex-direction: column;
                gap: 2px;
                padding: 9px 10px;
                border: 1px solid var(--stroke);
                border-radius: 10px;
            }

            .doc__main {
                display: flex;
                flex-direction: column;
                gap: 1px;
                min-width: 0;
            }

            .doc__name {
                font-size: 12px;
                font-weight: 600;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .doc__line {
                display: flex;
                align-items: center;
                gap: 4px;
                min-width: 0;
                color: var(--muted);
                font-size: 11px;
            }

            .doc__sep:empty {
                display: none;
            }

            /* ---------- 画面 / 图片区 ---------- */

            .shot {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .shot__box {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 96px;
                max-height: 200px;
                overflow: hidden;
                border-radius: 10px;
                border: 1px solid var(--stroke);
                background: var(--panel);
                box-sizing: border-box;
            }

            .shot__box--small {
                min-height: 64px;
                max-height: 120px;
            }

            .shot__img {
                max-width: 100%;
                max-height: 200px;
                object-fit: contain;
                display: block;
            }

            .shot__empty {
                color: var(--placeholder);
                font-size: 11px;
            }

            /* ---------- 生成 ---------- */

            .gen {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .check {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                color: var(--muted);
                font-size: 11px;
                cursor: pointer;
                flex: none;
            }

            .input {
                width: 100%;
                height: 30px;
                box-sizing: border-box;
                padding: 0 9px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 12px;
            }

            .input:focus {
                outline: none;
                border-color: var(--muted);
            }

            .input option {
                background: var(--panel);
                color: var(--text);
            }

            .textarea {
                width: 100%;
                box-sizing: border-box;
                min-height: 64px;
                resize: vertical;
                padding: 7px 9px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 12px;
                line-height: 1.6;
            }

            .textarea:focus {
                outline: none;
                border-color: var(--muted);
            }

            .gen__state.error {
                color: #ef4444;
            }

            /* ---------- 折叠区 ---------- */

            .collapse {
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .collapse__head {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 11px;
                padding: 3px 0;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 2px;
            }

            .collapse__head:hover {
                color: var(--text);
            }

            .collapse__chevron {
                display: inline-block;
                width: 12px;
                transition: transform 0.15s ease;
            }

            .collapse.open .collapse__chevron {
                transform: rotate(90deg);
            }

            .collapse.open .collapse__head {
                color: var(--text);
            }

            .collapse__body {
                display: none;
                flex-direction: column;
                gap: 8px;
                padding: 4px 0 2px;
            }

            .collapse.open .collapse__body {
                display: flex;
            }

            #log {
                margin: 0;
                padding: 8px;
                min-height: 72px;
                max-height: 200px;
                overflow: auto;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: var(--panel);
                color: var(--muted);
                font-size: 11px;
                line-height: 1.6;
                white-space: pre-wrap;
                word-break: break-word;
            }
        </style>
    </head>
    <body>
        <div class="app">
            <div class="bar">
                <div class="bar__status">
                    <span id="dot" class="dot"></span>
                    <span id="status" class="bar__text">未连接</span>
                </div>
                <button id="connect" type="button" class="textbtn">连接</button>
            </div>

            <div class="tabs">
                <button id="tab-display-btn" type="button" class="tab tab--active">画面</button>
                <button id="tab-config-btn" type="button" class="tab">配置</button>
            </div>

            <section id="tab-display" class="pane">
                <div class="doc">
                    <div class="row row--between">
                        <div class="doc__main">
                            <div id="doc-name" class="doc__name">没有打开的文档</div>
                            <div class="doc__line">
                                <span id="doc-meta" class="muted"></span>
                                <span class="doc__sep">·</span>
                                <span id="doc-state" class="muted"></span>
                            </div>
                        </div>
                        <button id="refresh" type="button" class="textbtn">刷新</button>
                    </div>
                </div>

                <div class="shot">
                    <div class="row row--between">
                        <span class="section__title">画面</span>
                        <button id="shot-refresh" type="button" class="textbtn">刷新预览</button>
                    </div>
                    <div class="shot__box">
                        <img id="shot-image" class="shot__img" alt="" hidden />
                        <span id="shot-empty" class="shot__empty">没有打开的文档</span>
                    </div>
                    <div class="row">
                        <button id="send-canvas" type="button" class="btn btn--primary">发送到画布</button>
                        <span class="spacer"></span>
                        <button id="recv-canvas" type="button" class="btn">从画布接收</button>
                    </div>
                </div>

                <div class="gen" id="result-card" hidden>
                    <div class="row row--between">
                        <span class="section__title">生成结果</span>
                        <button id="gen-apply" type="button" class="btn">添加到图层</button>
                    </div>
                    <div class="shot__box shot__box--small">
                        <img id="preview" class="shot__img" alt="" hidden />
                        <span id="result-empty" class="shot__empty">渲染完成后显示在这里</span>
                    </div>
                </div>
            </section>

            <section id="tab-config" class="pane" hidden>
                <div class="gen">
                    <div class="row row--between">
                        <span class="section__title">AI 生成</span>
                        <label class="check"><input id="ref-toggle" type="checkbox" checked /><span>参考当前画面</span></label>
                    </div>
                    <select id="model-select" class="input">
                        <option value="">默认模型</option>
                    </select>
                    <textarea id="prompt" class="textarea" placeholder="描述你想要的画面…"></textarea>
                    <div class="row row--between">
                        <span id="gen-state" class="muted gen__state">就绪</span>
                        <button id="render" type="button" class="btn btn--primary">渲染</button>
                    </div>
                </div>

                <div class="collapse" id="log-section">
                    <button class="collapse__head" id="log-toggle" type="button">日志<span class="collapse__chevron">›</span></button>
                    <div class="collapse__body">
                        <pre id="log"></pre>
                    </div>
                </div>

                <div class="collapse" id="relay-section">
                    <button class="collapse__head" id="relay-toggle" type="button">中继地址<span class="collapse__chevron">›</span></button>
                    <div class="collapse__body">
                        <input id="url" class="input" type="text" placeholder="http://localhost:23310" />
                        <input id="token" class="input" type="text" placeholder="token（中继要求时填写，可留空）" />
                        <div class="row">
                            <span class="spacer"></span>
                            <button id="apply" type="button" class="textbtn">应用并重连</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <script src="main.js"></script>
    </body>
</html>
