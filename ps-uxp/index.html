<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>PS 节点</title>
        <style>
            /* ============================================================
               UI 规范（严格统一）
               间距：卡片间距 5 / 页面内边距 12 / 卡片内边距 12 / 内部行距 8
               圆角：控件 8 / 卡片 12 / 预览 14
               控件：高度 32，输入类=单层深色填充无边框
               字号：正文 12 / 辅助 11.5 / 提示 10.5 / 区块标题 12.5
               ============================================================ */
            :root {
                color-scheme: dark;
                --text: #ededed;
                --muted: rgba(255, 255, 255, 0.55);
                --placeholder: rgba(255, 255, 255, 0.32);
                --stroke: rgba(255, 255, 255, 0.14);
                --hover: rgba(255, 255, 255, 0.08);
                --active: rgba(255, 255, 255, 0.16);
                --panel: #1a1a1a;
                --card: #242424;
                --input: #1b1b1b;
                --btn: #2e2e2e;
                --preview: #151515;
            }

            @media (prefers-color-scheme: light) {
                :root {
                    color-scheme: light;
                    --text: #1a1a1a;
                    --muted: rgba(0, 0, 0, 0.52);
                    --placeholder: rgba(0, 0, 0, 0.34);
                    --stroke: rgba(0, 0, 0, 0.14);
                    --hover: rgba(0, 0, 0, 0.06);
                    --active: rgba(0, 0, 0, 0.1);
                    --panel: #f4f4f4;
                    --card: #ffffff;
                    --input: #efefef;
                    --btn: #e8e8e8;
                    --preview: #e9e9e9;
                }
            }

            html,
            body {
                margin: 0;
                height: 100%;
                background: transparent;
                color: var(--text);
                font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
                font-size: 12px;
                line-height: 1.5;
                overflow: hidden;
            }

            [hidden] {
                display: none !important;
            }

            .app {
                display: flex;
                flex-direction: column;
                gap: 8px;
                height: 100vh;
                box-sizing: border-box;
                padding: 12px;
                overflow-y: auto;
                overflow-x: hidden;
            }

            /* 设置页：卡片间距严格 5px */
            #view-settings {
                gap: 5px;
            }

            .app::-webkit-scrollbar {
                width: 6px;
            }

            .app::-webkit-scrollbar-thumb {
                background: var(--stroke);
                border-radius: 3px;
            }

            .app::-webkit-scrollbar-track {
                background: transparent;
            }

            .row {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
                flex: none;
            }

            .row--between {
                justify-content: space-between;
            }

            .spacer {
                flex: 1;
            }

            .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--muted);
                flex: none;
            }

            .dot.ok {
                background: #22c55e;
            }

            .dot.error {
                background: #ef4444;
            }

            .muted {
                color: var(--muted);
                font-size: 11.5px;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .hint {
                color: var(--placeholder);
                font-size: 10.5px;
                padding: 0 2px;
                flex: none;
            }

            .textbtn {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 12px;
                padding: 5px 9px;
                border-radius: 8px;
                cursor: pointer;
                white-space: nowrap;
                flex: none;
            }

            .textbtn:hover:not(:disabled) {
                background: var(--hover);
                color: var(--text);
            }

            .textbtn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .btn {
                appearance: none;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 4px;
                height: 32px;
                padding: 0 14px;
                border: 0;
                border-radius: 8px;
                background: var(--btn);
                color: var(--text);
                font: inherit;
                font-size: 12px;
                cursor: pointer;
                white-space: nowrap;
                flex: none;
            }

            .btn:hover:not(:disabled) {
                filter: brightness(1.12);
            }

            .btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .btn--primary {
                background: var(--text);
                color: var(--panel);
                font-weight: 600;
            }

            .btn--grow {
                flex: 1;
            }

            .bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                min-height: 26px;
                flex: none;
            }

            .bar__status {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
            }

            .bar__text {
                font-size: 12px;
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .docline {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
                flex: none;
            }

            .docline__name {
                color: var(--text);
                font-size: 12px;
                font-weight: 600;
                max-width: 44%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .docline__meta,
            .docline__state {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 11.5px;
            }

            .preview {
                position: relative;
                flex: 1 1 170px;
                min-height: 150px;
                border-radius: 14px;
                background: var(--preview);
                overflow: hidden;
            }

            .preview__img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
            }

            .preview__img--result {
                background: var(--preview);
            }

            .preview__empty {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--placeholder);
                font-size: 11.5px;
                padding: 0 16px;
                text-align: center;
            }

            .preview__overlay {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 10px;
                background: linear-gradient(to top, rgba(0, 0, 0, 0.55), transparent);
            }

            .preview__label {
                font-size: 11.5px;
                color: var(--muted);
            }

            .preview--clickable {
                cursor: pointer;
            }

            .controls {
                display: flex;
                flex-direction: column;
                gap: 8px;
                flex: none;
                padding: 12px;
                border-radius: 12px;
                background: var(--card);
            }

            .section__title {
                font-size: 12px;
                font-weight: 600;
                color: var(--text);
            }

            .switch {
                position: relative;
                width: 32px;
                height: 18px;
                flex: none;
                padding: 0;
                border: 0;
                border-radius: 999px;
                background: var(--active);
                cursor: pointer;
                appearance: none;
            }

            .switch[aria-pressed="true"] {
                background: var(--text);
            }

            .switch__thumb {
                position: absolute;
                top: 2px;
                left: 2px;
                width: 14px;
                height: 14px;
                border-radius: 50%;
                background: var(--panel);
                transition: transform 0.15s ease;
            }

            .switch[aria-pressed="true"] .switch__thumb {
                transform: translateX(14px);
            }

            .switch__label {
                font-size: 11.5px;
                color: var(--muted);
                flex: none;
            }

            .check {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                color: var(--muted);
                font-size: 11.5px;
                cursor: default;
                flex: none;
            }

            .input {
                width: 100%;
                min-width: 0;
                height: 32px;
                box-sizing: border-box;
                padding: 0 10px;
                border: 0;
                border-radius: 8px;
                background: var(--input);
                color: var(--text);
                font: inherit;
                font-size: 12px;
                flex: none;
            }

            .input:focus {
                outline: none;
                box-shadow: inset 0 0 0 1px var(--muted);
            }

            .input option {
                background: var(--panel);
                color: var(--text);
            }

            .textarea {
                width: 100%;
                box-sizing: border-box;
                height: 64px;
                min-height: 52px;
                resize: none;
                padding: 8px 10px;
                border: 0;
                border-radius: 8px;
                background: var(--input);
                color: var(--text);
                font: inherit;
                font-size: 12px;
                line-height: 1.5;
                flex: none;
            }

            .textarea:focus {
                outline: none;
                box-shadow: inset 0 0 0 1px var(--muted);
            }

            .gen__state {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-size: 11.5px;
            }

            .gen__state.error {
                color: #ef4444;
            }

            /* ---------------- 设置视图 ---------------- */

            .settings__head {
                display: flex;
                align-items: center;
                gap: 8px;
                flex: none;
                padding: 0 2px;
            }

            .settings__group {
                display: flex;
                flex-direction: column;
                gap: 8px;
                flex: none;
                padding: 12px;
                border-radius: 12px;
                background: var(--card);
            }

            .settings__group > * {
                flex: none;
            }

            .settings__title {
                font-size: 12.5px;
                font-weight: 600;
                color: var(--text);
            }

            .field {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .field__label {
                font-size: 11.5px;
                color: var(--muted);
            }

            /* 分段控件：整行三等分，严格对齐 */
            .seg {
                display: flex;
                width: 100%;
                gap: 2px;
                padding: 2px;
                box-sizing: border-box;
                border-radius: 9px;
                background: var(--input);
            }

            .seg button {
                appearance: none;
                flex: 1;
                min-width: 0;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 12px;
                height: 28px;
                border-radius: 7px;
                cursor: pointer;
                font-variant-numeric: tabular-nums;
            }

            .seg button:hover {
                background: var(--hover);
                color: var(--text);
            }

            .seg button[aria-pressed="true"] {
                background: var(--text);
                color: var(--panel);
                font-weight: 600;
            }

            #settings-log {
                margin: 0;
                padding: 8px;
                min-height: 64px;
                max-height: 140px;
                overflow: auto;
                border: 0;
                border-radius: 8px;
                background: var(--input);
                color: var(--muted);
                font-size: 10.5px;
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
            }        </style>
    </head>
    <body>
        <div class="app" id="view-main">
            <div class="bar">
                <div class="bar__status">
                    <span id="dot" class="dot"></span>
                    <span id="status" class="bar__text">未连接</span>
                </div>
                <div class="row">
                    <button id="open-settings" type="button" class="textbtn" title="设置">⚙ 设置</button>
                    <button id="connect" type="button" class="textbtn">连接</button>
                </div>
            </div>

            <div class="docline">
                <span id="doc-name" class="docline__name">没有打开的文档</span>
                <span id="doc-meta" class="muted"></span>
                <span id="doc-state" class="docline__state muted"></span>
                <button id="refresh" type="button" class="textbtn">刷新</button>
            </div>

            <div class="preview" id="preview-box">
                <img id="shot-image" class="preview__img" alt="" hidden />
                <img id="preview" class="preview__img preview__img--result" alt="" hidden />
                <span id="preview-empty" class="preview__empty">没有打开的文档</span>
                <div id="result-overlay" class="preview__overlay" hidden>
                    <span class="preview__label">生成结果</span>
                    <span class="spacer"></span>
                    <button id="gen-apply" type="button" class="btn btn--primary" disabled>添加到图层</button>
                    <button id="result-close" type="button" class="btn">返回画面</button>
                </div>
            </div>


            <div class="controls">
                <div class="row row--between">
                    <div class="row">
                        <span class="section__title">AI 生成</span>
                        <button id="preview-ref-switch" type="button" class="switch" role="switch" aria-pressed="true" title="预览：参考画面 / 生成结果">
                            <span class="switch__thumb"></span>
                        </button>
                        <span class="switch__label" id="preview-ref-label">参考</span>
                    </div>
                    <div class="check"><input id="ref-toggle" type="checkbox" checked /><span>参考当前画面</span></div>
                </div>

                <div class="row">
                    <select id="model-select" class="input">
                        <option value="">默认模型</option>
                    </select>
                    <button id="render" type="button" class="btn btn--primary">渲染 ▶</button>
                </div>

                <textarea id="prompt" class="textarea" placeholder="描述你想要的画面…"></textarea>

                <span id="gen-state" class="muted gen__state">就绪</span>
            </div>

            <div class="hint">设置：点右上角 ⚙ 设置</div>
        </div>
        <script src="main.js"></script>
        <div class="app" id="view-settings" hidden>
            <div class="settings__head">
                <button id="close-settings" type="button" class="textbtn">‹ 返回</button>
                <span class="section__title">PS 节点设置</span>
                <span class="spacer"></span>
                <span class="dot" id="settings-dot"></span>
                <span class="muted" id="settings-status">未连接</span>
            </div>

            <div class="settings__group">
                <div class="settings__title">连接</div>
                <input id="setting-url" class="input" type="text" placeholder="http://localhost:23310" />
                <input id="setting-token" class="input" type="text" placeholder="token（中继要求时填写，可留空）" />
                <div class="row">
                    <button id="setting-test" type="button" class="textbtn">测试连接</button>
                    <span class="spacer"></span>
                    <button id="setting-apply" type="button" class="btn">应用并重连</button>
                </div>
            </div>

            <div class="settings__group">
                <div class="settings__title">生成</div>
                <div class="field">
                    <span class="field__label">默认模型</span>
                    <select id="setting-model" class="input">
                        <option value="">默认模型</option>
                    </select>
                </div>
                <div class="check"><input id="setting-ref" type="checkbox" checked /><span>默认参考当前画面</span></div>
                <div class="check"><input id="setting-auto-apply" type="checkbox" /><span>渲染后自动添加到图层</span></div>
            </div>

            <div class="settings__group">
                <div class="settings__title">预览</div>
                <div class="field">
                    <span class="field__label">预览最长边</span>
                    <div class="seg" id="setting-preview-size">
                        <button type="button" data-value="512">512</button>
                        <button type="button" data-value="1024">1024</button>
                        <button type="button" data-value="2048">2048</button>
                    </div>
                </div>
                <div class="check"><input id="setting-auto-refresh" type="checkbox" checked /><span>自动刷新预览</span></div>
            </div>

            <div class="settings__group">
                <div class="settings__title">日志</div>
                <pre id="settings-log"></pre>
                <div class="row">
                    <span class="spacer"></span>
                    <button id="setting-log-clear" type="button" class="textbtn">清空日志</button>
                </div>
            </div>

            <div class="settings__group">
                <div class="settings__title">关于</div>
                <div class="muted" id="settings-about">PS 节点 v0.1.20</div>
            </div>
        </div>    </body>
</html>
