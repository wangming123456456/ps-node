<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>PS 节点</title>
        <style>
            :root {
                color-scheme: dark;
                --text: #e8e8e8;
                --muted: rgba(255, 255, 255, 0.55);
                --placeholder: rgba(255, 255, 255, 0.3);
                --stroke: rgba(255, 255, 255, 0.12);
                --hover: rgba(255, 255, 255, 0.08);
                --active: rgba(255, 255, 255, 0.14);
                --panel: #1c1c1c;
                --field: rgba(255, 255, 255, 0.06);
            }

            @media (prefers-color-scheme: light) {
                :root {
                    color-scheme: light;
                    --text: #1a1a1a;
                    --muted: rgba(0, 0, 0, 0.5);
                    --placeholder: rgba(0, 0, 0, 0.32);
                    --stroke: rgba(0, 0, 0, 0.12);
                    --hover: rgba(0, 0, 0, 0.05);
                    --active: rgba(0, 0, 0, 0.08);
                    --panel: #f6f6f6;
                    --field: rgba(0, 0, 0, 0.05);
                }
            }

            html,
            body {
                margin: 0;
                height: 100%;
                background: transparent;
                color: var(--text);
                font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
                font-size: 12px;
                line-height: 1.4;
                overflow: hidden;
            }

            [hidden] {
                display: none !important;
            }

            .app {
                display: flex;
                flex-direction: column;
                gap: 6px;
                height: 100vh;
                box-sizing: border-box;
                padding: 8px;
                overflow-y: auto;
                overflow-x: hidden;
            }

            /* 面板高度不够时整页滚动，不让内容互相挤压 */
            .bar,
            .docline,
            .row,
            .collapse {
                flex: none;
            }

            .app::-webkit-scrollbar {
                width: 6px;
            }

            .app::-webkit-scrollbar-thumb {
                background: var(--stroke);
                border-radius: 3px;
            }

            .app::-webkit-scrollbar-track {
                background: transparent;
            }

            .row {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }

            .row--between {
                justify-content: space-between;
            }

            .spacer {
                flex: 1;
            }

            .dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: var(--muted);
                flex: none;
            }

            .dot.ok {
                background: #22c55e;
            }

            .dot.error {
                background: #ef4444;
            }

            .muted {
                color: var(--muted);
                font-size: 11px;
                min-width: 0;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .textbtn {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 11px;
                padding: 3px 6px;
                border-radius: 6px;
                cursor: pointer;
                white-space: nowrap;
                flex: none;
            }

            .textbtn:hover:not(:disabled) {
                background: var(--hover);
                color: var(--text);
            }

            .textbtn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .btn {
                appearance: none;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 4px;
                height: 28px;
                padding: 0 10px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 11px;
                cursor: pointer;
                white-space: nowrap;
                flex: none;
            }

            .btn:hover:not(:disabled) {
                background: var(--hover);
            }

            .btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .btn--primary {
                border-color: transparent;
                background: var(--text);
                color: var(--panel);
                font-weight: 600;
            }

            .btn--primary:hover:not(:disabled) {
                opacity: 0.86;
                background: var(--text);
            }

            .btn--grow {
                flex: 1;
            }

            .bar {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 6px;
                min-height: 20px;
            }

            .bar__status {
                display: flex;
                align-items: center;
                gap: 5px;
                min-width: 0;
            }

            .bar__text {
                font-size: 11px;
                color: var(--muted);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .docline {
                display: flex;
                align-items: center;
                gap: 5px;
                min-width: 0;
                color: var(--muted);
                font-size: 11px;
            }

            .docline__name {
                color: var(--text);
                font-size: 11px;
                font-weight: 600;
                max-width: 46%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .docline__meta,
            .docline__state {
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .docline__state {
                margin-left: auto;
            }

            .preview {
                position: relative;
                flex: 1 1 160px;
                min-height: 140px;
                border-radius: 10px;
                border: 1px solid var(--stroke);
                background: var(--panel);
                overflow: hidden;
            }

            .preview__img {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                object-fit: contain;
                display: block;
            }

            .preview__img--result {
                background: var(--panel);
            }

            .preview__empty {
                position: absolute;
                inset: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--placeholder);
                font-size: 11px;
            }

            .preview__overlay {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 8px;
                background: linear-gradient(to top, color-mix(in srgb, var(--panel) 92%, transparent), transparent);
            }

            .preview__label {
                font-size: 11px;
                color: var(--muted);
            }

            .section__title {
                font-size: 11px;
                font-weight: 600;
                color: var(--text);
            }

            .check {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                color: var(--muted);
                font-size: 11px;
                cursor: pointer;
                flex: none;
            }

            .input {
                width: 100%;
                min-width: 0;
                height: 28px;
                box-sizing: border-box;
                padding: 0 8px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 11px;
            }

            .input:focus {
                outline: none;
                border-color: var(--muted);
            }

            .input option {
                background: var(--panel);
                color: var(--text);
            }

            .textarea {
                width: 100%;
                box-sizing: border-box;
                height: 52px;
                min-height: 40px;
                resize: none;
                padding: 6px 8px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 11px;
                line-height: 1.5;
            }

            .textarea:focus {
                outline: none;
                border-color: var(--muted);
            }

            .gen__state {
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }

            .gen__state.error {
                color: #ef4444;
            }

            .collapse {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }

            .collapse__head {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 11px;
                padding: 3px 0;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 2px;
                text-align: left;
            }

            .collapse__head:hover {
                color: var(--text);
            }

            .collapse__chevron {
                display: inline-block;
                width: 10px;
                transition: transform 0.15s ease;
            }

            .collapse.open .collapse__chevron {
                transform: rotate(90deg);
            }

            .collapse.open .collapse__head {
                color: var(--text);
            }

            .collapse__body {
                display: none;
                flex-direction: column;
                gap: 6px;
                padding: 2px 0;
            }

            .collapse.open .collapse__body {
                display: flex;
            }

            #log {
                margin: 0;
                padding: 6px;
                min-height: 56px;
                max-height: 140px;
                overflow: auto;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: var(--panel);
                color: var(--muted);
                font-size: 10px;
                line-height: 1.5;
                white-space: pre-wrap;
                word-break: break-word;
            }
        </style>
    </head>
    <body>
        <div class="app">
            <div class="bar">
                <div class="bar__status">
                    <span id="dot" class="dot"></span>
                    <span id="status" class="bar__text">未连接</span>
                </div>
                <button id="connect" type="button" class="textbtn">连接</button>
            </div>

            <div class="docline">
                <span id="doc-name" class="docline__name">没有打开的文档</span>
                <span id="doc-meta" class="muted"></span>
                <span id="doc-state" class="docline__state muted"></span>
                <button id="refresh" type="button" class="textbtn">刷新</button>
            </div>

            <div class="preview">
                <img id="shot-image" class="preview__img" alt="" hidden />
                <img id="preview" class="preview__img preview__img--result" alt="" hidden />
                <span id="preview-empty" class="preview__empty">没有打开的文档</span>
                <div id="result-overlay" class="preview__overlay" hidden>
                    <span class="preview__label">生成结果</span>
                    <span class="spacer"></span>
                    <button id="gen-apply" type="button" class="btn btn--primary" disabled>添加到图层</button>
                    <button id="result-close" type="button" class="btn">返回画面</button>
                </div>
            </div>


            <div class="row row--between">
                <span class="section__title">AI 生成</span>
                <label class="check"><input id="ref-toggle" type="checkbox" checked /><span>参考当前画面</span></label>
            </div>

            <div class="row">
                <select id="model-select" class="input">
                    <option value="">默认模型</option>
                </select>
                <button id="render" type="button" class="btn btn--primary">渲染 ▶</button>
            </div>

            <textarea id="prompt" class="textarea" placeholder="描述你想要的画面…"></textarea>

            <div class="row row--between">
                <span id="gen-state" class="muted gen__state">就绪</span>
                <button id="shot-refresh" type="button" class="textbtn">刷新预览</button>
            </div>

            <div class="collapse" id="log-section">
                <button class="collapse__head" id="log-toggle" type="button">日志<span class="collapse__chevron">›</span></button>
                <div class="collapse__body" id="log-body" hidden>
                    <pre id="log"></pre>
                </div>
            </div>

            <div class="collapse" id="relay-section">
                <button class="collapse__head" id="relay-toggle" type="button">中继地址<span class="collapse__chevron">›</span></button>
                <div class="collapse__body" id="relay-body" hidden>
                    <input id="url" class="input" type="text" placeholder="http://localhost:23310" />
                    <input id="token" class="input" type="text" placeholder="token（中继要求时填写，可留空）" />
                    <div class="row">
                        <span class="spacer"></span>
                        <button id="apply" type="button" class="textbtn">应用并重连</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="main.js"></script>
    </body>
</html>
