<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>PS 节点</title>
        <style>
            :root {
                color-scheme: dark;
                --bg: #232323;
                --text: #e0e0e0;
                --muted: rgba(255, 255, 255, 0.6);
                --placeholder: rgba(255, 255, 255, 0.35);
                --stroke: rgba(255, 255, 255, 0.12);
                --hover: rgba(255, 255, 255, 0.06);
                --active: rgba(255, 255, 255, 0.1);
                --panel: #1f1f1f;
            }

            @media (prefers-color-scheme: light) {
                :root {
                    color-scheme: light;
                    --bg: #f5f5f5;
                    --text: #1a1a1a;
                    --muted: rgba(0, 0, 0, 0.5);
                    --placeholder: rgba(0, 0, 0, 0.35);
                    --stroke: rgba(0, 0, 0, 0.12);
                    --hover: rgba(0, 0, 0, 0.05);
                    --active: rgba(0, 0, 0, 0.08);
                    --panel: #ffffff;
                }
            }

            html,
            body {
                margin: 0;
                height: 100%;
                background: transparent;
                color: var(--text);
                font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
                font-size: 12px;
                line-height: 1.5;
            }

            .app {
                display: flex;
                flex-direction: column;
                gap: 12px;
                padding: 12px;
                box-sizing: border-box;
            }

            .row {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
            }

            .row--between {
                justify-content: space-between;
            }

            .spacer {
                flex: 1;
            }

            .dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                background: var(--muted);
                flex: none;
            }

            .dot.ok {
                background: #22c55e;
            }

            .dot.error {
                background: #ef4444;
            }

            .muted {
                color: var(--muted);
                font-size: 11px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .textbtn {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 12px;
                padding: 4px 8px;
                border-radius: 6px;
                cursor: pointer;
                white-space: nowrap;
            }

            .textbtn:hover:not(:disabled) {
                background: var(--hover);
                color: var(--text);
            }

            .textbtn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .doc {
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding: 10px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
            }

            .doc__name {
                font-size: 13px;
                font-weight: 600;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .doc__meta {
                color: var(--muted);
                font-size: 11px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .collapse__head {
                appearance: none;
                border: 0;
                background: transparent;
                color: var(--muted);
                font: inherit;
                font-size: 12px;
                padding: 2px 0;
                cursor: pointer;
                display: flex;
                align-items: center;
                gap: 2px;
            }

            .collapse__head:hover {
                color: var(--text);
            }

            .collapse__chevron {
                display: inline-block;
                width: 12px;
                transition: transform 0.15s ease;
            }

            .collapse.open .collapse__chevron {
                transform: rotate(90deg);
            }

            .collapse.open .collapse__head {
                color: var(--text);
            }

            .collapse__body {
                display: none;
                flex-direction: column;
                gap: 8px;
                padding: 8px 0 2px;
            }

            .collapse.open .collapse__body {
                display: flex;
            }

            .shot {
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 10px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
            }

            .shot__title {
                font-size: 13px;
                font-weight: 600;
            }

            .shot__box {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 120px;
                max-height: 220px;
                overflow: hidden;
                border-radius: 6px;
                border: 1px solid var(--stroke);
                background: var(--panel);
            }

            .shot__img {
                max-width: 100%;
                max-height: 220px;
                object-fit: contain;
                display: block;
            }

            .gen {
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 10px;
                border: 1px solid var(--stroke);
                border-radius: 8px;
            }

            .gen__title {
                font-size: 13px;
                font-weight: 600;
            }

            .check {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                color: var(--muted);
                font-size: 11px;
                cursor: pointer;
            }

            .textarea {
                width: 100%;
                box-sizing: border-box;
                min-height: 64px;
                resize: vertical;
                padding: 8px;
                border: 1px solid var(--stroke);
                border-radius: 6px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 12px;
                line-height: 1.6;
            }

            .textarea:focus,
            .input:focus {
                outline: none;
                border-color: var(--muted);
            }

            .primary {
                appearance: none;
                border: 0;
                border-radius: 6px;
                background: var(--text);
                color: var(--panel);
                font: inherit;
                font-size: 12px;
                font-weight: 600;
                padding: 6px 14px;
                cursor: pointer;
                white-space: nowrap;
            }

            .primary:hover:not(:disabled) {
                opacity: 0.88;
            }

            .primary:disabled,
            .ghost:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

            .ghost {
                appearance: none;
                border: 0;
                border-radius: 6px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 12px;
                padding: 6px 12px;
                cursor: pointer;
                white-space: nowrap;
            }

            .ghost:hover:not(:disabled) {
                background: var(--hover);
            }

            .preview {
                width: 100%;
                max-height: 180px;
                object-fit: contain;
                border-radius: 6px;
                border: 1px solid var(--stroke);
                box-sizing: border-box;
            }

            .gen__state.error {
                color: #ef4444;
            }

            .input {
                height: 28px;
                box-sizing: border-box;
                width: 100%;
                padding: 0 8px;
                border: 1px solid var(--stroke);
                border-radius: 6px;
                background: transparent;
                color: var(--text);
                font: inherit;
                font-size: 12px;
            }

            .input:focus {
                outline: none;
                border-color: var(--muted);
            }

            #log {
                margin: 0;
                padding: 8px;
                min-height: 96px;
                max-height: 220px;
                overflow: auto;
                border: 1px solid var(--stroke);
                border-radius: 8px;
                background: var(--panel);
                color: var(--muted);
                font-size: 11px;
                line-height: 1.6;
                white-space: pre-wrap;
                word-break: break-word;
            }
        </style>
    </head>
    <body>
        <div class="app">
            <div class="row row--between">
                <span class="row">
                    <span id="dot" class="dot"></span>
                    <span id="status" class="muted">未连接</span>
                </span>
                <button id="connect" type="button" class="textbtn">连接</button>
            </div>

            <div class="doc">
                <div id="doc-name" class="doc__name">没有打开的文档</div>
                <div id="doc-meta" class="doc__meta"></div>
                <div class="row row--between">
                    <span id="doc-state" class="muted">等待连接…</span>
                    <button id="refresh" type="button" class="textbtn">刷新</button>
                </div>
            </div>

            <div class="shot">
                <div class="row row--between">
                    <span class="shot__title">画面</span>
                    <button id="shot-refresh" type="button" class="textbtn">刷新预览</button>
                </div>
                <div class="shot__box">
                    <img id="shot-image" class="shot__img" alt="" hidden />
                    <span id="shot-empty" class="muted">没有打开的文档</span>
                </div>
                <div class="row">
                    <button id="send-canvas" type="button" class="primary">发送到画布</button>
                    <span class="spacer"></span>
                    <button id="recv-canvas" type="button" class="ghost">从画布接收</button>
                </div>
            </div>

            <div class="gen">
                <div class="row row--between">
                    <span class="gen__title">AI 生成</span>
                    <label class="check"><input id="ref-toggle" type="checkbox" checked /><span>参考当前画面</span></label>
                </div>
                <select id="model-select" class="input">
                    <option value="">默认模型</option>
                </select>
                <textarea id="prompt" class="textarea" placeholder="描述你想要的画面…"></textarea>
                <div class="row row--between">
                    <span id="gen-state" class="muted gen__state">就绪</span>
                    <button id="render" class="primary" type="button">渲染</button>
                </div>
                <img id="preview" class="preview" alt="" hidden />
                <div class="row">
                    <span class="spacer"></span>
                    <button id="gen-apply" class="ghost" type="button" disabled>添加到图层</button>
                </div>
            </div>

            <div class="collapse" id="log-section">
                <button class="collapse__head" id="log-toggle" type="button">日志<span class="collapse__chevron">›</span></button>
                <div class="collapse__body">
                    <pre id="log"></pre>
                </div>
            </div>

            <div class="collapse" id="relay-section">
                <button class="collapse__head" id="relay-toggle" type="button">中继地址<span class="collapse__chevron">›</span></button>
                <div class="collapse__body">
                    <input id="url" class="input" type="text" placeholder="http://localhost:23310" />
                    <input id="token" class="input" type="text" placeholder="token（中继要求时填写，可留空）" />
                    <div class="row">
                        <span class="spacer"></span>
                        <button id="apply" type="button" class="textbtn">应用并重连</button>
                    </div>
                </div>
            </div>
        </div>
        <script src="main.js"></script>
    </body>
</html>
